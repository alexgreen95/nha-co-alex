name: Content Push PG17 CRLF witness

on:
  push:
    branches:
      - content-push-pg17-crlf-ci-20261023

permissions:
  contents: read

jobs:
  pg17-crlf-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify and transform migration to CRLF
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');

          const path = 'database/migrations/20261022_content_push_delivery.sql';
          const expected = '66CBC57E17499DD017F40BA7C1C25C4961A38A19A3C323871D0222FFF2B90B7A';
          const headBytes = execFileSync('git', ['show', `HEAD:${path}`]);
          const workspaceBytes = fs.readFileSync(path);
          const sha256 = bytes => createHash('sha256').update(bytes).digest('hex').toUpperCase();
          const canonicalize = bytes => {
            const out = [];
            for (let i = 0; i < bytes.length; i++) {
              if (bytes[i] === 0x0d) {
                if (bytes[i + 1] === 0x0a) i++;
                out.push(0x0a);
              } else {
                out.push(bytes[i]);
              }
            }
            return Buffer.from(out);
          };

          const canonicalHead = canonicalize(headBytes);
          const canonicalWorkspace = canonicalize(workspaceBytes);
          if (sha256(canonicalHead) !== expected) throw new Error('HEAD migration SHA256 mismatch');
          if (!canonicalWorkspace.equals(canonicalHead)) throw new Error('workspace differs from HEAD beyond line endings');
          if (sha256(canonicalWorkspace) !== expected) throw new Error('canonical migration SHA256 mismatch');

          const crlf = [];
          for (const byte of canonicalHead) {
            if (byte === 0x0a) crlf.push(0x0d, 0x0a);
            else crlf.push(byte);
          }
          const transformed = Buffer.from(crlf);
          fs.writeFileSync(path, transformed);

          const actual = fs.readFileSync(path);
          let crlfCount = 0;
          for (let i = 0; i < actual.length; i++) {
            if (actual[i] === 0x0a) {
              if (actual[i - 1] !== 0x0d) throw new Error('bare LF found after transform');
              crlfCount++;
            }
            if (actual[i] === 0x0d && actual[i + 1] !== 0x0a) throw new Error('lone CR found after transform');
          }
          const rawHash = sha256(actual);
          const roundTrip = canonicalize(actual);
          if (crlfCount === 0) throw new Error('CRLF line endings not found');
          if (rawHash === expected) throw new Error('raw CRLF SHA256 unexpectedly equals reviewed LF SHA256');
          if (sha256(roundTrip) !== expected || !roundTrip.equals(canonicalHead))
            throw new Error('CRLF-to-LF round trip differs from reviewed migration');
          console.log(`reviewed_lf_sha256=${expected}`);
          console.log(`raw_crlf_sha256=${rawHash}`);
          console.log(`crlf_line_count=${crlfCount}`);
          console.log('canonical_byte_equality=PASS');
          NODE

      - name: Provision isolated PostgreSQL 17.11 witness
        shell: bash
        run: |
          set -Eeuo pipefail

          root=/tmp/nca-pg17-guard-witness-62kuw392
          socket="$root/socket"
          client="$root/bin/psql"
          test ! -e "$root"
          mkdir -p "$socket" "$root/bin"
          chmod 0777 "$socket"

          cat > "$client" <<'ADAPTER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          exec docker --host=unix:///var/run/docker.sock exec -i nca-pg17-guard-witness env -i \
            PATH=/usr/local/bin:/usr/bin:/bin LANG=C LC_ALL=C TZ=UTC \
            HOME=/nonexistent-nca-content-test PGPASSFILE=/dev/null \
            PGSERVICEFILE=/dev/null PGSYSCONFDIR=/nonexistent-nca-content-test \
            PGCONNECT_TIMEOUT=3 PGAPPNAME=nca_content_local \
            psql "$@"
          ADAPTER
          chmod 0755 "$client"

          docker run --detach \
            --name nca-pg17-guard-witness \
            --network none \
            --mount "type=bind,src=$socket,dst=$socket" \
            --env POSTGRES_DB=nca_guard_witness \
            --env POSTGRES_USER=nca_guard_witness_admin \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:17.11-bookworm \
            postgres -c "unix_socket_directories=$socket,/var/run/postgresql"

          ready=0
          for _ in $(seq 1 60); do
            if docker exec nca-pg17-guard-witness pg_isready \
              --host="$socket" --port=5432 \
              --username=nca_guard_witness_admin --dbname=nca_guard_witness \
              >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' nca-pg17-guard-witness | grep -Fxq true; then
              echo 'PostgreSQL witness container exited before becoming ready.' >&2
              docker inspect nca-pg17-guard-witness || true
              docker logs nca-pg17-guard-witness || true
              exit 1
            fi
            sleep 1
          done
          test "$ready" -eq 1
          docker inspect --format '{{.HostConfig.NetworkMode}}' nca-pg17-guard-witness | grep -Fx none

      - name: Run isolated Content Push PG17 regression
        run: node --test tests/content-push-pg17.test.cjs

      - name: Remove local witness artifacts
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker rm --force nca-pg17-guard-witness 2>/dev/null || true
          rm -rf /tmp/nca-pg17-guard-witness-62kuw392
