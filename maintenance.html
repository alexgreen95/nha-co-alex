<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Nhà có Alex · Đang bảo trì</title>
<style>
:root{color-scheme:dark;--bg:#17131f;--panel:#221b2d;--text:#f7eefb;--muted:#c8b9d1;--pink:#ff68b7;--violet:#b99cff;--line:#4b3c60}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{min-height:100vh;display:grid;place-items:center;padding:28px 18px;background:radial-gradient(circle at 50% 20%,#32213f 0,#1d1727 34%,var(--bg) 72%);font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.card{width:min(560px,100%);padding:38px 30px;border:1px solid var(--line);border-radius:24px;background:rgba(34,27,45,.9);box-shadow:0 18px 70px rgba(0,0,0,.35),0 0 34px rgba(185,156,255,.08);text-align:center}
.mark{width:54px;height:54px;margin:0 auto 20px;display:grid;place-items:center;border-radius:18px;border:1px solid rgba(255,104,183,.55);box-shadow:0 0 22px rgba(255,104,183,.2);font-size:27px}
h1{margin:0;font-size:clamp(28px,7vw,40px);letter-spacing:-.02em;text-shadow:0 0 20px rgba(255,104,183,.28)}
.brand{display:block;margin-top:6px;font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--pink)}
p{margin:20px auto 0;max-width:430px;font-size:16px;line-height:1.65;color:var(--muted)}
.note{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:#9f91aa}
</style>
</head>
<body>
<main class="card" role="status" aria-live="polite">
<div class="mark" aria-hidden="true">🛠️</div>
<h1>Trang đang bảo trì</h1>
<span class="brand">Nhà có Alex</span>
<p>Hệ thống đang tạm ngưng để xử lý một sự cố kỹ thuật. Bạn vui lòng quay lại sau nha. Cảm ơn mọi người đã kiên nhẫn chờ 💜</p>
<div class="note">Trang sẽ hoạt động lại ngay khi việc xử lý hoàn tất.</div>
</main>
</body>
</html>
